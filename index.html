<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0d1513"><meta name="referrer" content="no-referrer">
<title>Foxopt</title>
<style>
:root{--bg:#eef2f1;--card:#fbfdfc;--ink:#14231f;--mut:#5b6b66;--line:#d5dedb;--acc:#0f8a6d;--bad:#c2410c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1513;--card:#14201d;--ink:#e6efec;--mut:#8fa49d;--line:#243531;--acc:#3cc9a0;--bad:#ff8a5b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}
h1{margin:0;font-size:20px}p{margin:0;color:var(--mut);font-size:14px}
input[type=password]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
#err{color:var(--bad);font-size:14px;min-height:1.2em}
</style></head><body>
<form id="f" autocomplete="on">
<h1>Foxopt</h1><p>Dit dashboard is versleuteld. Vul je wachtwoord in om het te openen.</p>
<input type="text" name="username" value="foxopt" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord" required>
<label><input id="rem" type="checkbox"> Onthoud op dit toestel</label>
<button id="go">Openen</button><div id="err" role="alert"></div>
</form>

const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
const K="foxopt-pw";
function get(){try{return localStorage.getItem(K)}catch(e){return null}}
function set(v){try{v==null?localStorage.removeItem(K):localStorage.setItem(K,v)}catch(e){}}
async function attempt(pw,remember){
  const err=document.getElementById("err"),go=document.getElementById("go");
  if(!crypto||!crypto.subtle){err.textContent="Deze browser kan niet ontsleutelen (HTTPS nodig).";return}
  go.disabled=true;err.textContent="";
  try{await open_(pw);if(remember)set(pw)}
  catch(e){set(null);err.textContent="Fout wachtwoord.";go.disabled=false}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
  attempt(document.getElementById("pw").value,document.getElementById("rem").checked)});
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
const saved=get();if(saved)attempt(saved,true);
